blueprint:
  name: Lichtsteuerung - Helligkeit, Nachlauf und Bypass
  description: >
    Schaltet eine oder mehrere Lampen bei einer neuen ON-Flanke eines Eingangs
    nur unterhalb des Lux-Grenzwerts ein. Schaltet nach einer einstellbaren
    Nachlaufzeit aus, wenn alle Eingänge OFF sind. UNKNOWN/UNAVAILABLE löst
    niemals eine Schaltung aus und verhindert das automatische Ausschalten.
    Eine neue ON-Flanke des Bypass schaltet alle Lampen um. Nach der maximalen
    Bypass-Dauer wird der Bypass-Schalter zurückgesetzt, ohne Lampen zu schalten.
    Bypass muss ein steuerbarer switch oder input_boolean sein.
  domain: automation
  input:
    inputs:
      name: Eingänge
      description: Ein oder mehrere Schalter oder Binärsensoren.
      selector:
        entity:
          multiple: true
          filter:
            - domain: switch
            - domain: binary_sensor
            - domain: input_boolean
    lux_sensor:
      name: Helligkeitssensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: illuminance
    lux_threshold:
      name: Einschaltschwelle (Lux)
      default: 100
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          mode: box
          unit_of_measurement: lx
    lights:
      name: Lampen
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    off_delay:
      name: Nachlaufzeit nach OFF
      default:
        hours: 0
        minutes: 2
        seconds: 0
      selector:
        duration: {}
    bypass_entity:
      name: Bypass-Schalter
      description: Steuerbarer switch oder input_boolean, kein binary_sensor.
      selector:
        entity:
          filter:
            - domain: switch
            - domain: input_boolean
    bypass_max_duration:
      name: Maximale Bypass-Dauer
      default:
        hours: 2
        minutes: 0
        seconds: 0
      selector:
        duration: {}

variables:
  input_entities: !input inputs
  lux_entity: !input lux_sensor
  lux_limit: !input lux_threshold
  light_entities: !input lights

triggers:
  - trigger: state
    entity_id: !input inputs
    from: 'off'
    to: 'on'
    id: input_on

  - trigger: state
    entity_id: !input inputs
    from: 'on'
    to: 'off'
    for: !input off_delay
    id: input_off

  - trigger: state
    entity_id: !input bypass_entity
    from: 'off'
    to: 'on'
    id: bypass_on

  - trigger: state
    entity_id: !input bypass_entity
    to: 'on'
    for: !input bypass_max_duration
    id: bypass_timeout

conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: input_on
          - condition: template
            value_template: >-
              {{ is_number(states(lux_entity)) and
                 (states(lux_entity) | float(0)) < (lux_limit | float(0)) }}
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lights

      - conditions:
          - condition: trigger
            id: input_off
          - condition: template
            value_template: >-
              {{ input_entities | count > 0 and
                 expand(input_entities)
                 | selectattr('state', 'eq', 'off')
                 | list | count == input_entities | count }}
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input lights

      - conditions:
          - condition: trigger
            id: bypass_on
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ expand(light_entities)
                         | selectattr('state', 'eq', 'on')
                         | list | count > 0 }}
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: !input lights
            default:
              - action: light.turn_on
                target:
                  entity_id: !input lights

      - conditions:
          - condition: trigger
            id: bypass_timeout
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input bypass_entity

mode: queued
max: 20
